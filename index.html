<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LITHOS - Audiobook Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            text-align: center;
        }
        .logo {
            margin-bottom: 40px;
        }
        .logo h1 {
            font-size: 4rem;
            color: #3FA9B5;
            letter-spacing: 8px;
            margin-bottom: 10px;
        }
        .logo p {
            color: #888;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .links a {
            display: block;
            padding: 18px 30px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .links a:hover {
            background: rgba(63, 169, 181, 0.2);
            border-color: #3FA9B5;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 60px;
            color: #666;
            font-size: 0.85rem;
        }
        .badge {
            display: inline-block;
            margin-top: 30px;
        }
        .badge img {
            height: 60px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>LITHOS</h1>
            <p>Audiobook Player</p>
        </div>

        <div class="links">
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
        </div>

        <div class="badge">
            <a href="https://play.google.com/store/apps/details?id=com.mossglen.lithos">
                <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play">
            </a>
        </div>

        <div class="footer">
            <p>© 2026 Mossglen. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
